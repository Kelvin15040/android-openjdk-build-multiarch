name: Build OpenJDK 25

on:
  push:
    branches: [buildjre25]
    tags: ["jre25-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_android:
    strategy:
      matrix:
        arch: ["aarch64"]
        version: [25]
      fail-fast: false

    name: "Build Java ${{ matrix.version }} for Android ${{ matrix.arch }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      # JDK 25 builds with a JDK 24 boot JDK; using a different version also makes
      # the build produce a matching host jlink in buildjdk/
      - name: Set up boot JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: "24"
          distribution: temurin

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install cmake autoconf python3 python-is-python3 unzip zip systemtap-sdt-dev libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxt-dev

      # The runner ships its own NDK in ANDROID_NDK_HOME; unset it so the pinned r28 is downloaded
      - name: Build with CI build script
        run: env -u ANDROID_NDK_HOME -u ANDROID_NDK_ROOT -u ANDROID_NDK_LATEST_HOME TARGET_VERSION=${{ matrix.version }} BOOT_JDK="$JAVA_HOME" bash "1_ci_build_arch_${{ matrix.arch }}.sh"

      - name: Upload Pojlib JRE zip
        uses: actions/upload-artifact@v4
        with:
          name: "JRE-${{ matrix.version }}"
          path: JRE-${{ matrix.version }}.zip

      - name: Upload JRE build output
        uses: actions/upload-artifact@v4
        with:
          name: "jre${{ matrix.version }}-${{ matrix.arch }}"
          path: jre${{ matrix.version }}*.tar.xz

      - name: Upload JRE debuginfo build output
        uses: actions/upload-artifact@v4
        with:
          name: "jre${{ matrix.version }}-debuginfo-${{ matrix.arch }}"
          path: dizout

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/jre25-')
        env:
          GH_TOKEN: ${{ github.token }}
        # Not --latest: Pojlib fetches JRE.zip from the latest release, which must keep holding it
        run: gh release create "$GITHUB_REF_NAME" JRE-${{ matrix.version }}.zip --repo "$GITHUB_REPOSITORY" --latest=false --title "$GITHUB_REF_NAME" --notes "OpenJDK 25 (jdk-25.0.5-ga) for Android aarch64, packaged for Pojlib."
